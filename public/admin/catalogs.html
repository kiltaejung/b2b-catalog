<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카탈로그 관리 - B2B 카탈로그 관리자</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <nav class="nav">
    <strong>B2B 카탈로그 관리자</strong>
    <a href="index.html">홈</a>
    <a href="products.html">상품관리</a>
    <a href="catalogs.html" class="active">카탈로그 관리</a>
    <a href="quotes.html">견적함</a>
  </nav>
  <div class="container">
    <h1>카탈로그 관리</h1>

    <div class="card">
      <h2 id="formTitle" style="margin-top:0">카탈로그 생성</h2>
      <form id="catalogForm" class="form-grid">
        <input type="hidden" id="catalogId" />
        <label>시즌명
          <input type="text" id="seasonName" placeholder="예: 2026 설 선물세트" />
        </label>
        <label>메인 타이틀 *
          <input type="text" id="mainTitle" required placeholder="예: 2026 설 선물세트 카다로그" />
        </label>
        <label>회사 로고
          <input type="file" id="companyLogoFile" accept="image/png,image/jpeg,image/webp" />
          <img id="companyLogoPreview" class="thumb" style="display:none; margin-top:0.3rem" />
        </label>
        <label>표지 대표 이미지 URL
          <input type="url" id="coverImageUrl" />
        </label>
        <label>표지 뒷면 이미지 URL
          <input type="url" id="backCoverImageUrl" />
        </label>
        <label>고객사명
          <input type="text" id="clientName" placeholder="고객사 전용 카탈로그인 경우 입력" />
        </label>
        <label>고객사 로고
          <input type="file" id="clientLogoFile" accept="image/png,image/jpeg,image/webp" />
          <img id="clientLogoPreview" class="thumb" style="display:none; margin-top:0.3rem" />
        </label>
        <label class="checkbox-row" style="grid-column: 1 / -1">
          <input type="checkbox" id="showPrice" checked />
          가격 표시 (해제 시 가격 숨김)
        </label>
        <label style="grid-column: 1 / -1">카테고리 노출 순서 (쉼표로 구분, 비우면 자동)
          <input type="text" id="categoryOrder" placeholder="예: 과일,건강식품,스팸,참치,한우,생활용품" />
        </label>
        <label>최대 확대 배율 (1.5 ~ 6배)
          <input type="number" id="maxZoom" min="1.5" max="6" step="0.5" value="3" />
        </label>
        <div class="errors" id="catalogFormErrors" style="display:none; grid-column: 1 / -1"></div>
        <div class="toolbar" style="grid-column: 1 / -1">
          <button type="submit" id="submitBtn">카탈로그 생성 (전체 상품 포함)</button>
          <button type="button" class="secondary" id="cancelEditBtn" style="display:none">취소</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2 style="margin-top:0">카탈로그 상품 배치</h2>
      <p class="muted">카테고리별로 페이지를 나누고, 각 페이지에 노출할 상품 수(3개, 4개 또는 6개)를 지정합니다. 상품은 노출순서에 따라 앞에서부터 자동 배치됩니다.</p>
      <div id="pageLayoutContainer"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">생성된 카탈로그</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>고객사</th>
              <th>가격표시</th>
              <th>생성일</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="catalogTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/catalogs.js"></script>
</body>
</html>
