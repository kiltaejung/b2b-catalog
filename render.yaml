databases:
  - name: b2b-catalog-db
    plan: free
    databaseName: b2b_catalog
    user: b2b_catalog

services:
  - type: web
    name: b2b-catalog
    runtime: node
    plan: free
    branch: claude/b2b-catalog-system-c47k2u
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: b2b-catalog-db
          property: connectionString
      - key: KAKAO_JS_KEY
        sync: false
